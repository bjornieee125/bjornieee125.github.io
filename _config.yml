title: Haissam MOUSSA
subtitle: Master SSIR student · Cybersecurity · CTF player
description: >- # this means to ignore newlines until "baseurl:"
  Portfolio of Haissam MOUSSA (Bjornieee) — Master SSIR student at Université de Toulouse.
  CTF writeups, homelab and security projects.

url: "https://bjornieee125.github.io" # the base hostname & protocol for your site
baseurl: "" # the subpath of your site, e.g. /blog

# Navigation
urls:
  - text: Home
    url: /
  - text: About
    url: /about
  - text: Writeups
    url: /blog
  - text: Projects
    url: /projects
  - text: Contact
    url: /contact

# Author details
author_logo: profile.png # replace assets/img/profile.png with your photo
author: Haissam
author_bio: >-
  Hi, I'm Haissam MOUSSA (aka Bjornieee), a Master's student in Information Systems and Network
  Security (SSIR) at Université de Toulouse. I'm passionate about offensive security and secure
  infrastructure: I play CTFs (web, mobile, forensics, crypto, reverse) and publish my writeups here,
  and I run a Proxmox homelab to practice hardening, segmentation and self-hosting.
author_email: "haissammoussa916@gmail.com"
author_location: Toulouse, France
author_website_url:
typewrite-text: Cybersecurity student · CTF player · Homelab enthusiast
hero_cover_img: sample_cover.jpg # replace this for changing homepage cover. Image should be in /assets/img

# Skills (shown as progress bars on the About page, level in %)
author_skills:
  - name: Web security (Burp Suite)
    level: 75
  - name: Network scanning & analysis (Nmap, Wireshark)
    level: 70
  - name: Python & Bash scripting
    level: 70
  - name: Linux administration
    level: 75
  - name: Virtualization & containers (Proxmox, Podman)
    level: 65
  - name: Automation (Ansible, GitHub Actions)
    level: 55
  - name: Reverse engineering (Ghidra)
    level: 40
  - name: Password cracking (Hashcat, John)
    level: 50

# Experiences
author_work_experiences:
  - company_name: UPSILON — Junior Enterprise of Université de Toulouse
    company_logo:
    company_url: https://upsilon-conseil.com
    designation: IS & Quality Pole Member (2023 – present)
    description: >-
      Quality Management System (SMQ) initiatives, process automation within the IS pole,
      and advisory audits of other junior enterprises on behalf of the CNJE.
    visibility: true

# Education
author_education_details:
  - college_logo:
    college_name: Université de Toulouse
    college_url:
    college_degree: Master SSIR — Information Systems & Network Security
    description: "2024 – 2026 · Penetration testing, network security, governance, cryptography, forensics"
    visibility: true
  - college_logo:
    college_name: Université de Toulouse
    college_url:
    college_degree: Bachelor's Degree in Computer Science
    description: "2021 – 2024 · Networks, systems and software development"
    visibility: true

# Projects (short list on the About page; full pages live in _projects/)
author_project_details:
  - project_thumbnail:
    project_title: Proxmox Homelab
    project_description: Personal Proxmox-based infrastructure for security hardening, segmentation and self-hosting.
    project_url: /projects/homelab/
    visibility: true
  - project_thumbnail:
    project_title: UPSILON — Junior Enterprise
    project_description: IS & Quality pole — SMQ, automation and CNJE advisory audits.
    project_url: /projects/upsilon/
    visibility: true

# CTF categories used to filter writeups (each needs a page in categories/)
ctf_categories: [web, mobile, forensics, crypto, reverse, pwn, osint, misc]

# social links
github_username: bjornieee125
linkedin_username: haissammoussa
tryhackme_username: Bjornieee

# syntax highlighter
markdown: kramdown
highlighter: rouge
permalink: pretty

# Choose what to show ( can be true or false)
show_author_work_experiences: true
show_author_education_details: true
show_author_project_details: true

# pagination of posts
paginate: 6
per_page: 6
paginate_path: "/blog/page/:num/"

collections:
  authors:
    output: true
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: haissam
      permalink: /blog/:year/:title/
  - scope:
      path: ""
      type: projects
    values:
      layout: page
  - scope:
      path: ""
      type: authors
    values:
      layout: author
      permalink: /blog/authors/:slug
  - scope:
      path: "assets/**"
    values:
      sitemap: false

# Build settings
plugins:
  - jekyll-paginate
  - jekyll-gist
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

sass:
  sass_dir: _sass
  style: compressed

exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - Rakefile
  - README.md
  - bower.json
  - _templates/
  - assets/bower_components/**/README.md
  - assets/bower_components/**/*.html
