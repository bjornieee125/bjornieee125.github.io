title: Haissam MOUSSA
lang: fr
subtitle: Étudiant en Master SSIR · Cybersécurité · Joueur de CTF
description: >- # this means to ignore newlines until "baseurl:"
  Portfolio de Haissam MOUSSA (Bjornieee) — étudiant en Master SSIR à l'Université de Toulouse.
  Writeups CTF, homelab et projets sécurité.

url: "https://bjornieee125.github.io" # the base hostname & protocol for your site
baseurl: "" # the subpath of your site, e.g. /blog

# Navigation
urls:
  - text: Accueil
    url: /
  - text: À propos
    url: /about
  - text: Writeups
    url: /blog
  - text: Projets
    url: /projects
  - text: Contact
    url: /contact

# Author details
author_logo: # e.g. profile.png — put your photo in assets/img/
author: Haissam
author_bio: >-
  Salut, je suis Haissam MOUSSA (alias Bjornieee), étudiant en Master Sécurité des Systèmes
  d'Information et des Réseaux (SSIR) à l'Université de Toulouse. Passionné par la sécurité offensive
  et les infrastructures sécurisées : je joue en CTF (web, mobile, forensics, crypto, reverse) et je publie
  mes writeups ici, et je fais tourner un homelab Proxmox pour pratiquer le durcissement, la segmentation
  et l'auto-hébergement.
author_email: "haissammoussa916@gmail.com"
author_location: Toulouse, France
author_website_url:
typewrite-text: Étudiant en cybersécurité · Joueur de CTF · Passionné de homelab
hero_cover_img: sample_cover.jpg # replace this for changing homepage cover. Image should be in /assets/img

# Compétences (barres de progression sur la page À propos, niveau en %)
author_skills:
  - name: Sécurité web (Burp Suite)
    level: 75
  - name: Scan et analyse réseau (Nmap, Wireshark)
    level: 70
  - name: Scripting Python & Bash
    level: 70
  - name: Administration Linux
    level: 75
  - name: Virtualisation & conteneurs (Proxmox, Podman)
    level: 65
  - name: Automatisation (Ansible, GitHub Actions)
    level: 55
  - name: Rétro-ingénierie (Ghidra)
    level: 40
  - name: Cassage de mots de passe (Hashcat, John)
    level: 50

# Experiences
author_work_experiences:
  - company_name: UPSILON — Junior-Entreprise de l'Université de Toulouse
    company_logo:
    company_url: https://upsilon-conseil.com
    designation: Membre du pôle SI & Qualité (2023 – aujourd'hui)
    description: >-
      Mise en place du Système de Management de la Qualité (SMQ), automatisation des processus du pôle SI,
      et audits-conseil d'autres Junior-Entreprises pour le compte de la CNJE.
    visibility: true

# Education
author_education_details:
  - college_logo:
    college_name: Université de Toulouse
    college_url:
    college_degree: Master SSIR — Sécurité des Systèmes d'Information et des Réseaux
    description: "2024 – 2026 · Tests d'intrusion, sécurité réseau, gouvernance, cryptographie, forensics"
    visibility: true
  - college_logo:
    college_name: Université de Toulouse
    college_url:
    college_degree: Licence Informatique
    description: "2021 – 2024 · Réseaux, systèmes et développement logiciel"
    visibility: true

# Projects (short list on the About page; full pages live in _projects/)
author_project_details:
  - project_thumbnail:
    project_title: Homelab Proxmox
    project_description: Infrastructure personnelle sous Proxmox pour le durcissement, la segmentation et l'auto-hébergement.
    project_url: /projects/homelab/
    visibility: true
  - project_thumbnail:
    project_title: UPSILON — Junior-Entreprise
    project_description: Pôle SI & Qualité — SMQ, automatisation et audits-conseil CNJE.
    project_url: /projects/upsilon/
    visibility: true

# CTF categories used to filter writeups (each needs a page in categories/)
ctf_categories: [web, mobile, forensics, crypto, reverse, pwn, osint, misc]

# social links
github_username: bjornieee125
linkedin_username: haissammoussa
tryhackme_username: Bjornieee

# syntax highlighter
markdown: kramdown
highlighter: rouge
permalink: pretty

# Choose what to show ( can be true or false)
show_author_work_experiences: true
show_author_education_details: true
show_author_project_details: true

# pagination of posts
paginate: 6
per_page: 6
paginate_path: "/blog/page/:num/"

collections:
  authors:
    output: true
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: haissam
      permalink: /blog/:year/:title/
  - scope:
      path: ""
      type: projects
    values:
      layout: page
  - scope:
      path: ""
      type: authors
    values:
      layout: author
      permalink: /blog/authors/:slug
  - scope:
      path: "assets/**"
    values:
      sitemap: false

# Build settings
plugins:
  - jekyll-paginate
  - jekyll-gist
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

sass:
  sass_dir: _sass
  style: compressed

exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - Rakefile
  - README.md
  - bower.json
  - _templates/
  - assets/bower_components/**/README.md
  - assets/bower_components/**/*.html
